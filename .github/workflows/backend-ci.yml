name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-migrations-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "AgendaiFisio-CI-2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'AgendaiFisio-CI-2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      ConnectionStrings__Padrao: "Server=127.0.0.1,1433;Database=agendaifisio_test;User Id=sa;Password=AgendaiFisio-CI-2026!;Encrypt=False;TrustServerCertificate=True"
      MIGRATION_TEST_CONNECTION_STRING: "Server=127.0.0.1,1433;Database=agendaifisio_migration_test;User Id=sa;Password=AgendaiFisio-CI-2026!;Encrypt=False;TrustServerCertificate=True"
      MIGRATION_TEST_ALLOW_RESET: "true"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5187
      JwtSettings__SecretKey: ci-only-secret-key-with-more-than-thirty-two-characters
      JwtSettings__Issuer: AgendaiFisioCI
      JwtSettings__Audience: AgendaiFisioCIClients
      JwtSettings__ExpirationHours: "1"
      AdminSeed__Email: ci-admin@example.invalid
      AdminSeed__Senha: Regression123!
      RegressionAdmin__Email: ci-admin@example.invalid
      RegressionAdmin__Senha: Regression123!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build solution
        run: |
          dotnet restore AgendaiFisio.sln
          dotnet build AgendaiFisio.sln -c Release --no-restore

      - name: Test SQL Server migration and database constraints
        run: dotnet run --project Tests/Migrations/MigrationTests.csproj -c Release --no-build

      - name: Run API regression and concurrency tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project AgendaiFisio.Api/AgendaiFisio.Api.csproj -c Release --no-build --no-launch-profile > /tmp/agendaifisio-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            status=$?
            if [[ $status -ne 0 ]]; then
              cat /tmp/agendaifisio-api.log
            fi
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5187/health >/dev/null; then
              break
            fi
            if [[ $attempt -eq 60 ]]; then
              echo "API did not become healthy"
              exit 1
            fi
            sleep 1
          done

          dotnet run --project Tests/Regression/Regression.csproj -c Release --no-build -- http://127.0.0.1:5187
